services:
  api:
    image: ${PROJECT_NAME:-practice-crm-nodejs}_api_dev:latest
    build:
      target: dependencies
    command: ['npm', 'run', 'dev']
    volumes:
      - ./backend:/app
      - api_node_modules:/app/node_modules
    environment:
      APP_ENV: development
      CHOKIDAR_USEPOLLING: 'true'
      CHOKIDAR_INTERVAL: '500'

  migrate:
    image: ${PROJECT_NAME:-practice-crm-nodejs}_migrate_dev:latest
    build:
      target: dependencies
    volumes:
      - ./backend:/app
      - api_node_modules:/app/node_modules
    environment:
      APP_ENV: development
    command:
      ['sh', '-c', 'npm run prisma:generate && npm run db:migrate:deploy && npm run db:seed']

volumes:
  api_node_modules:
    name: ${PROJECT_NAME:-practice-crm-nodejs}_api_node_modules
