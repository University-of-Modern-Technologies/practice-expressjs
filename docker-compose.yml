name: ${PROJECT_NAME:-practice-crm}

services:
  nginx:
    container_name: ${PROJECT_NAME:-practice-crm}_nginx
    image: ${PROJECT_NAME:-practice-crm}_nginx:latest
    restart: unless-stopped
    build:
      context: ./etc/nginx
      args:
        STACK: nodejs
    environment:
      - TZ=Europe/Kyiv
    ports:
      - '${HTTP_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - ntw

  api:
    container_name: ${PROJECT_NAME:-practice-crm}_api
    image: ${PROJECT_NAME:-practice-crm}_api:latest
    restart: unless-stopped
    build:
      context: ./nodejs-backend
      target: dependencies
    command: ['npm', 'run', 'dev']
    volumes:
      - ./nodejs-backend:/app
      # Keeps the modules installed in the image: without this the mount above
      # would hide them behind the host directory, which has none.
      - api_node_modules:/app/node_modules
    environment:
      TZ: Europe/Kyiv
      NODE_ENV: ${NODE_ENV:-development}
      HOST: 0.0.0.0
      PORT: 3000
      # File system events do not cross the Windows mount boundary, so the
      # watcher has to poll instead of waiting for them.
      CHOKIDAR_USEPOLLING: 'true'
      CHOKIDAR_INTERVAL: '500'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JSON_BODY_LIMIT: ${JSON_BODY_LIMIT:-1mb}
      CORS_ORIGINS: http://localhost:${HTTP_PORT:-8080},http://localhost:${WEB_PORT:-3100}
      DATABASE_URL: postgresql://${POSTGRES_USER:-practice_crm}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-practice_crm}?schema=public
      REDIS_URL: redis://redis:6379
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-crm:}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-300}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-300}
      AUTH_RATE_LIMIT_MAX_REQUESTS: ${AUTH_RATE_LIMIT_MAX_REQUESTS:-10}
      MONGODB_URL: mongodb://${MONGO_USER:-practice_crm}:${MONGO_PASSWORD:?Set MONGO_PASSWORD in .env}@mongo:27017/${MONGO_DB:-practice_events}?authSource=admin
      EVENT_LOG_RETENTION_DAYS: ${EVENT_LOG_RETENTION_DAYS:-90}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}
      WS_PATH: ${WS_PATH:-/api/v1/realtime}
    ports:
      - '${API_PORT:-3000}:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      # A first start on empty volumes populates the dependency volume before the
      # process can serve anything, and that takes minutes rather than seconds.
      # The window covers it, so a clean checkout comes up on the first attempt
      # instead of failing and working on the retry.
      start_period: 180s
    networks:
      - ntw

  web:
    container_name: ${PROJECT_NAME:-practice-crm}_web
    image: ${PROJECT_NAME:-practice-crm}_web:latest
    restart: unless-stopped
    build:
      context: ./frontend
      target: dependencies
    # Webpack rather than the default Turbopack: only the webpack watcher honours
    # WATCHPACK_POLLING, and polling is the only thing that notices a file change
    # made on the host.
    command:
      ['npm', 'run', 'dev', '--', '--webpack', '--port', '3100', '--hostname', '0.0.0.0']
    volumes:
      - ./frontend:/app
      # Keeps the modules installed in the image, and keeps the build output
      # inside the container where it does not fight the host file system.
      - web_node_modules:/app/node_modules
      - web_next_cache:/app/.next
    environment:
      TZ: Europe/Kyiv
      NEXT_PUBLIC_API_URL: /api/v1
      NEXT_PUBLIC_WS_URL: ${WS_PATH:-/api/v1/realtime}
      NEXT_TELEMETRY_DISABLED: '1'
      # File system events do not cross the Windows mount boundary, so the
      # watcher has to poll instead of waiting for them.
      WATCHPACK_POLLING: 'true'
      CHOKIDAR_USEPOLLING: 'true'
    ports:
      - '${WEB_PORT:-3100}:3100'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3100/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      # A first start on empty volumes populates the dependency volume before the
      # process can serve anything, and that takes minutes rather than seconds.
      # The window covers it, so a clean checkout comes up on the first attempt
      # instead of failing and working on the retry.
      start_period: 180s
    networks:
      - ntw

  migrate:
    container_name: ${PROJECT_NAME:-practice-crm}_migrate
    image: ${PROJECT_NAME:-practice-crm}_migrate:latest
    build:
      context: ./nodejs-backend
      target: dependencies
    volumes:
      - ./nodejs-backend:/app
      - api_node_modules:/app/node_modules
    environment:
      TZ: Europe/Kyiv
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-practice_crm}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-practice_crm}?schema=public
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:?Set SEED_USER_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
    command:
      ['sh', '-c', 'npm run prisma:generate && npm run db:migrate:deploy && npm run db:seed']
    restart: 'no'
    networks:
      - ntw

  postgres:
    container_name: ${PROJECT_NAME:-practice-crm}_postgres
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      TZ: Europe/Kyiv
      POSTGRES_DB: ${POSTGRES_DB:-practice_crm}
      POSTGRES_USER: ${POSTGRES_USER:-practice_crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ntw

  redis:
    container_name: ${PROJECT_NAME:-practice-crm}_redis
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    environment:
      - TZ=Europe/Kyiv
    volumes:
      - redis_data:/data
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ntw

  mongo:
    container_name: ${PROJECT_NAME:-practice-crm}_mongo
    image: mongo:8
    restart: unless-stopped
    environment:
      TZ: Europe/Kyiv
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-practice_crm}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Set MONGO_PASSWORD in .env}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-practice_events}
    volumes:
      - mongo_data:/data/db
    ports:
      - '${MONGO_PORT:-27017}:27017'
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - ntw

networks:
  ntw:
    name: ${PROJECT_NAME:-practice-crm}

volumes:
  postgres_data:
    name: ${PROJECT_NAME:-practice-crm}_postgres_data
  redis_data:
    name: ${PROJECT_NAME:-practice-crm}_redis_data
  mongo_data:
    name: ${PROJECT_NAME:-practice-crm}_mongo_data
  api_node_modules:
    name: ${PROJECT_NAME:-practice-crm}_api_node_modules
  web_node_modules:
    name: ${PROJECT_NAME:-practice-crm}_web_node_modules
  web_next_cache:
    name: ${PROJECT_NAME:-practice-crm}_web_next_cache
